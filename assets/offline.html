<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HiveLogic — Offline</title>
<style>
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#10131c;color:#C9CED6;
    font:15px/1.6 -apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .card{text-align:center;max-width:420px;padding:40px}
  .hex{width:96px;height:96px;margin:0 auto 24px}
  h1{font-size:22px;color:#fff;margin:0 0 8px;letter-spacing:.02em}
  p{margin:0 0 24px;color:#8b93a5}
  button{
    background:#28508C;color:#fff;border:0;border-radius:10px;
    font:600 14px inherit;padding:12px 28px;cursor:pointer;
  }
  button:hover{background:#3C5078}
</style>
</head>
<body>
  <div class="card">
    <svg class="hex" viewBox="0 0 100 100">
      <polygon points="50,4 90,27 90,73 50,96 10,73 10,27"
        fill="none" stroke="#3C5078" stroke-width="5"/>
      <path d="M36 30v40M64 30v40M36 50h28"
        stroke="#C9CED6" stroke-width="8" stroke-linecap="round" fill="none"/>
    </svg>
    <h1>No connection yet</h1>
    <p>HiveLogic needs to load once while online before offline mode has data to show. Connect to the internet and try again.</p>
    <button onclick="location.href='https://hivelogic-live.vercel.app/'">Retry</button>
  </div>
</body>
</html>
